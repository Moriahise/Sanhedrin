name: QA → data/questions (chunked)

on:
  push:
    paths:
      - "data/qa/*.json"
      - "data/qa/*/*.json"
      - "tools/qa_merge.py"
      - "qa_store.py"
      - "add_qa_upload.py"
      - "migrate_qa.py"
      - "rebuild_index.py"
      - "qa-data.js"
      - "qa.html"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: qa-question-store-update
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Syntax check
        run: |
          python3 -m py_compile migrate_qa.py qa_store.py add_qa_upload.py tools/qa_merge.py rebuild_index.py

      - name: Rebuild current index from chunks
        run: |
          python3 rebuild_index.py

      - name: Merge QA uploads into data/questions
        run: |
          python3 tools/qa_merge.py

      - name: Verify chunked question store
        run: |
          python3 add_qa_upload.py --verify

      - name: Commit & push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/questions
          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          git commit -m "Auto-update chunked Q&A data"
          for i in {1..5}; do
            git fetch origin main
            git pull --rebase origin main || true
            git push && break || {
              echo "Push failed, attempt $i/5"
              sleep 2
            }
          done
