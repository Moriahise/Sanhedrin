name: Q&A quality cleanup

on:
  workflow_dispatch: {}
  push:
    paths:
      - "quality_check_qa.py"
      - "rebuild_index.py"
      - ".github/scripts/quality_apply_questions.sh"
      - ".github/workflows/quality-apply-questions.yml"

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash .github/scripts/quality_apply_questions.sh
