name: Publish durable library
on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sanhedrin/**'
      - 'web/**'
      - 'Rav/**'
      - 'Sanhedrin/**'
      - 'config/**'
      - 'tools/audit_library.py'
      - 'requirements.txt'
      - 'data/qa/**'
      - 'miyodea/**'
      - 'qa_db/**'
      - 'qa_db.json'
      - 'responsa/**'
      - 'data/questions/**'
      - '.github/workflows/library-pipeline.yml'
permissions:
  contents: read
concurrency:
  group: sanhedrin-publisher
  cancel-in-progress: true
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Restore durable state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: python -m sanhedrin --report test-results/restore.json restore-release --repo "$REPOSITORY" --directory .sanhedrin/restore
      - name: Migrate new local inputs
        run: python -m sanhedrin --report test-results/migration.json migrate
      - name: Check configured sources
        env:
          STACKEXCHANGE_KEY: ${{ secrets.STACKEXCHANGE_KEY }}
        shell: bash
        run: |
          set +e
          python -m sanhedrin --report test-results/sync.json sync
          result=$?
          set -e
          if [ "$result" -ne 0 ] && [ "$result" -ne 2 ]; then exit "$result"; fi
      - name: Verify original IDs and build publication
        run: |
          python tools/audit_library.py
          python -m sanhedrin --report test-results/build.json build
          python -m sanhedrin --report test-results/export-verification.json verify-export
          python -m sanhedrin --report test-results/snapshot.json snapshot --directory .sanhedrin/snapshot
      - name: Persist state before deployment
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: python -m sanhedrin --report test-results/state-release.json publish-snapshot --repo "$REPOSITORY" --commit "$COMMIT" --directory .sanhedrin/snapshot
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: publication-report
          path: test-results/
          retention-days: 30
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
        id: deployment
  health:
    needs: [prepare, deploy]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - name: Report source and deployment health
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          gh run download "$RUN_ID" --repo "$REPOSITORY" --name publication-report --dir report
          python - <<'PY'
          import json, os
          from pathlib import Path
          report = json.loads(Path('report/sync.json').read_text())
          lines = ['## Sanhedrin source checks', '', '| Source | Status |', '|---|---|']
          lines += [f'| {p} | {r["status"]} |' for p, r in report['sources'].items()]
          lines += ['', 'Deployment: ' + os.environ['DEPLOY_RESULT']]
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as f:
              f.write('\n'.join(lines) + '\n')
          raise SystemExit(0 if report['status'] == 'ok' and os.environ['DEPLOY_RESULT'] == 'success' else 1)
          PY
