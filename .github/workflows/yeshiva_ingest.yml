name: Ingest Yeshiva QA

on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: responsa-update
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Ingest Yeshiva QA legacy mode
        run: |
          echo "Legacy responsa/qa_db ingest is disabled for automatic uploads."
          echo "Use QA → data/questions (chunked) for new uploads."
          exit 0
