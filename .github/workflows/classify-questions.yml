name: Classify questions data

on:
  workflow_dispatch: {}
  push:
    paths:
      - "classify_qa.py"
      - "KLASSIFIZIERUNG_ALTBESTAND.md"
      - ".github/scripts/classify_questions_data.sh"
      - ".github/workflows/classify-questions.yml"

permissions:
  contents: write

jobs:
  classify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash .github/scripts/classify_questions_data.sh
