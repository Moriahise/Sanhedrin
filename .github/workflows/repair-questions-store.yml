name: Repair questions store

on:
  workflow_dispatch: {}
  push:
    paths:
      - ".github/scripts/repair_questions_after_upload.sh"
      - ".github/workflows/repair-questions-store.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: bash .github/scripts/repair_questions_after_upload.sh
